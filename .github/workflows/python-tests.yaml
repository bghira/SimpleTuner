name: Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - "simpletuner/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - "simpletuner/**"
      - "tests/**"

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test,cpu]' --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Verify CPU PyTorch dependencies
      run: |
        python - <<'PY'
        import torch
        import torchaudio
        import torchvision

        print(f"torch={torch.__version__}, torchaudio={torchaudio.__version__}, torchvision={torchvision.__version__}")
        assert torch.version.cuda is None, "CPU tests require CPU PyTorch wheels"
        PY

    - name: Run Tests
      run: python -m unittest discover -v tests/

  js-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test
